<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Management Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --f1-red: #e10600;
            --dark-bg: #0b0b0b;
            --card-bg: #1a1a1a;
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-white);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--f1-red);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--f1-red);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .role-badge {
            background: var(--f1-red);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--text-gray);
            color: var(--text-white);
            padding: 6px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: white;
            color: black;
        }

        main {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid var(--f1-red);
        }

        .stat-card h3 {
            margin: 0;
            color: var(--text-gray);
            font-size: 14px;
            text-transform: uppercase;
        }

        .stat-card p {
            margin: 10px 0 0;
            font-size: 32px;
            font-weight: 700;
        }

        .management-section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 12px;
        }

        .btn-add {
            background: #2ecc71;
            color: white;
            margin-bottom: 20px;
        }

        .btn-export {
            background: #34495e;
            color: white;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            padding: 5px 10px;
        }

        .btn:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            color: var(--text-gray);
            font-size: 13px;
            text-transform: uppercase;
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 15px;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .form-container {
            margin-top: 20px;
            display: none;
            /* Ascuns default */
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            background: #222;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">F1<span>MANAGER</span></div>
        <div class="user-info">
            <span id="display-name">Loading...</span>
            <span id="display-role" class="role-badge">ROLE</span>
            <button class="btn-logout" onclick="logout()">LOGOUT</button>
        </div>
    </header>

    <main>
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Drivers</h3>
                <p id="stat-count">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Championship Points</h3>
                <p id="stat-points">0</p>
            </div>
            <div class="stat-card">
                <h3>Active Teams</h3>
                <p id="stat-teams">0</p>
            </div>
        </div>

        <div class="management-section">
            <div class="section-header">
                <h2>Driver Standings</h2>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <input type="text" id="searchTeam" placeholder="Search by Team..." oninput="searchByTeam()"
                        style="margin: 0; height: 30px; font-size: 12px;">
                    <button class="btn btn-export" style="background: #e67e22;" onclick="loadStandings()">Sort by
                        Points</button>
                    <div class="export-buttons">
                        <button class="btn btn-export" onclick="exportData('csv')">CSV</button>
                        <button class="btn btn-export" onclick="exportData('json')">JSON</button>
                        <button class="btn btn-export" onclick="exportData('xml')">XML</button>
                    </div>
                </div>
            </div>

            <button id="add-btn-toggle" class="btn btn-add" style="display:none" onclick="toggleAddForm()">+ Add New
                Driver</button>

            <div id="add-form" class="form-container">
                <input type="hidden" id="editDriverId">
                <input type="text" id="newName" placeholder="Driver Name">

                <select id="newTeam"
                    style="background: #333; color: white; border: 1px solid #444; border-radius: 5px; padding: 5px;">
                    <option value="" disabled selected>Select Team</option>
                    <option value="Mercedes">Mercedes</option>
                    <option value="Red Bull Racing">Red Bull Racing</option>
                    <option value="Ferrari">Scuderia Ferrari</option>
                    <option value="McLaren">McLaren</option>
                    <option value="Aston Martin">Aston Martin </option>
                    <option value="Audi">Audi</option>
                    <option value="Williams">Williams</option>
                    <option value="Cadillac">Cadillac</option>
                    <option value="Racing Bulls">Racing Bulls</option>
                    <option value="Haas">MoneyGram Haas F1 Team</option>
                </select>

                <input type="number" id="newPoints" placeholder="Points">
                <input type="text" id="newNationality" placeholder="Nationality">
                <button id="save-btn" class="btn btn-add" onclick="saveDriver()">Save</button>
                <button id="cancel-btn" class="btn btn-export" style="display:none"
                    onclick="resetForm()">Cancel</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Team</th>
                        <th>Points</th>
                        <th>Nationality</th>
                        <th id="actions-header" style="display:none">Actions</th>
                    </tr>
                </thead>
                <tbody id="driver-table-body">
                </tbody>
            </table>
        </div>

        <div id="user-management-section" class="management-section" style="margin-top: 40px; display: none;">
            <div class="section-header">
                <h2 style="color: #2ecc71;">System User Management</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Current Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                </tbody>
            </table>
        </div>

        <div class="management-section" style="margin-top: 40px; border-left: 5px solid #f1c40f;">
            <div class="section-header">
                <h2 style="color: #f1c40f;">Live Activity Log</h2>
                <button class="btn btn-export" onclick="loadNotifications()">Refresh Log</button>
            </div>
            <div id="notification-list"
                style="max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; background: #000; padding: 15px; border-radius: 10px;">
                <p style="color: #666;">Waiting for events...</p>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = "http://localhost:8081/api/drivers";
        const AUTH_CMD   = "http://localhost:8082/api/auth/commands";
        const AUTH_QUERY = "http://localhost:8082/api/auth/queries";
        const NOTIF_BASE = "http://localhost:8083/api/notifications";
        let currentUser = { name: '', role: '', team: '' };

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            let role = urlParams.get('role');
            let userName = urlParams.get('username');
            let team = urlParams.get('team');

            if (role && userName) {
                localStorage.setItem('userRole', role);
                localStorage.setItem('userName', userName);
                localStorage.setItem('userTeam', team || '');
                window.history.replaceState(null, null, window.location.pathname);
            } else {
                role = localStorage.getItem('userRole');
                userName = localStorage.getItem('userName');
                team = localStorage.getItem('userTeam');
            }

            if (!role) {
                window.location.replace("http://localhost:8082/login.html");
                return;
            }

            currentUser.name = userName;
            currentUser.role = role;
            currentUser.team = team;

            document.getElementById('display-name').innerText = "Welcome, " + userName;
            document.getElementById('display-role').innerText = role + (team ? ` (${team})` : '');

            if (role === 'ADMIN' || role === 'TEAM_MANAGER') {
                document.getElementById('add-btn-toggle').style.display = 'block';
                document.getElementById('actions-header').style.display = 'table-cell';
            }

            if (role === 'ADMIN') {
                document.getElementById('user-management-section').style.display = 'block';
                loadUsers();
            }

            loadDrivers();
            loadNotifications();
            setInterval(loadNotifications, 10000);
        });

        async function loadNotifications() {
            try {
                const res = await fetch(NOTIF_BASE);
                const notifs = await res.json();
                const list = document.getElementById('notification-list');
                if (notifs.length === 0) return;

                list.innerHTML = notifs.map(n => `
                <div style="margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 4px;">
                    <span style="color: #f1c40f;">[${n.timestamp.split('T')[1].split('.')[0]}]</span>
                    <span style="color: #e10600; font-weight: bold;">[${n.serviceSource}]</span>
                    <span style="color: #fff;">${n.message}</span>
                </div>
            `).join('');
            } catch (e) { console.error("Notification service is down"); }
        }

        async function loadDrivers() {
            try {
                const res = await fetch(`${API_BASE}/queries/all`);
                const drivers = await res.json();
                renderTable(drivers);
                updateStats(drivers);
            } catch (e) { console.error(e); }
        }

        async function loadStandings() {
            try {
                const res = await fetch(`${API_BASE}/queries/standings`);
                const drivers = await res.json();
                renderTable(drivers);
            } catch (e) { console.error(e); }
        }

        async function searchByTeam() {
            const team = document.getElementById('searchTeam').value;
            if (!team) { loadDrivers(); return; }
            try {
                const res = await fetch(`${API_BASE}/queries/team/${team}`);
                const drivers = await res.json();
                renderTable(drivers);
            } catch (e) { console.error(e); }
        }

        function renderTable(drivers) {
            const body = document.getElementById('driver-table-body');
            body.innerHTML = "";
            drivers.forEach(d => {
                const canEdit = (currentUser.role === 'ADMIN') || (currentUser.role === 'TEAM_MANAGER' && d.team === currentUser.team);
                const row = document.createElement('tr');
                row.innerHTML = `
                <td>${d.name}</td>
                <td>${d.team}</td>
                <td>${d.points}</td>
                <td>${d.nationality}</td>
                ${(currentUser.role === 'ADMIN' || currentUser.role === 'TEAM_MANAGER') ?
                        `<td>
                        ${canEdit ? `
                            <button class="btn btn-export" style="padding: 5px 10px; font-size: 10px; background: #3498db;" onclick="editDriver(${JSON.stringify(d).replace(/"/g, '&quot;')})">Edit</button>
                            <button class="btn btn-delete" style="font-size: 10px;" onclick="deleteDriver(${d.id})">Delete</button>
                        ` : '<span style="color: #555; font-size: 10px;">View Only</span>'}
                    </td>` : ''}
            `;
                body.appendChild(row);
            });
        }

        function updateStats(drivers) {
            document.getElementById('stat-count').innerText = drivers.length;
            const totalPoints = drivers.reduce((acc, d) => acc + d.points, 0);
            document.getElementById('stat-points').innerText = totalPoints;
            const teams = new Set(drivers.map(d => d.team));
            document.getElementById('stat-teams').innerText = teams.size;
        }

        function editDriver(driver) {
            document.getElementById('editDriverId').value = driver.id;
            document.getElementById('newName').value = driver.name;
            document.getElementById('newTeam').value = driver.team;
            document.getElementById('newPoints').value = driver.points;
            document.getElementById('newNationality').value = driver.nationality;

            const isManager = currentUser.role === 'TEAM_MANAGER';
            document.getElementById('newTeam').disabled = isManager;
            document.getElementById('newPoints').disabled = isManager;

            document.getElementById('save-btn').innerText = "Update Driver";
            document.getElementById('cancel-btn').style.display = "inline-block";
            document.getElementById('add-form').style.display = "grid";
        }

        async function saveDriver() {
            const id = document.getElementById('editDriverId').value;
            const payload = {
                name: document.getElementById('newName').value,
                team: document.getElementById('newTeam').value,
                points: parseInt(document.getElementById('newPoints').value),
                nationality: document.getElementById('newNationality').value
            };
            const url = id ? `${API_BASE}/commands/update/${id}` : `${API_BASE}/commands/create`;
            const method = id ? 'PUT' : 'POST';
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) { resetForm(); loadDrivers(); loadNotifications(); }
        }

        async function deleteDriver(id) {
            if (!confirm("Are you sure?")) return;
            const res = await fetch(`${API_BASE}/commands/delete/${id}`, { method: 'DELETE' });
            if (res.ok) { loadDrivers(); loadNotifications(); }
        }

        // --- USER MANAGEMENT LOGIC (ADMIN) ---
        async function loadUsers() {
            try {
                const res = await fetch(`${AUTH_QUERY}/users`);
                const users = await res.json();
                const body = document.getElementById('user-table-body');
                body.innerHTML = "";
                users.forEach(u => {
                    const row = document.createElement('tr');
                    const isManager = u.role === 'TEAM_MANAGER';
                    row.innerHTML = `
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td><span class="role-badge" style="background: #34495e;">${u.role}</span></td>
                    <td>
                        ${isManager ? `
                            <input type="text" placeholder="Team Name..." value="${u.managedTeam || ''}" 
                                   onchange="updateUserRole(${u.id}, null, this.value)" 
                                   style="padding: 5px; border-radius: 5px; background: #333; color: white; width: 100px; border: 1px solid #f1c40f;">
                        ` : '<span style="color: #666; font-size: 11px;">N/A</span>'}
                        
                        <select onchange="updateUserRole(${u.id}, this.value, null)" style="padding: 5px; border-radius: 5px; background: #333; color: white; margin-left: 10px;">
                            <option value="">Role...</option>
                            <option value="GUEST" ${u.role === 'GUEST' ? 'selected' : ''}>GUEST</option>
                            <option value="TEAM_MANAGER" ${u.role === 'TEAM_MANAGER' ? 'selected' : ''}>TEAM MANAGER</option>
                            <option value="ADMIN" ${u.role === 'ADMIN' ? 'selected' : ''}>ADMIN</option>
                        </select>
                        <button class="btn btn-delete" style="font-size: 10px; margin-left: 10px;" onclick="deleteUser(${u.id})">Delete</button>
                    </td>
                `;
                    body.appendChild(row);
                });
            } catch (e) { console.error(e); }
        }

        async function updateUserRole(userId, newRole, newTeam) {
            const payload = {};
            if (newRole) payload.role = newRole;
            if (newTeam !== null && newTeam !== undefined) payload.managedTeam = newTeam;

            const res = await fetch(`${AUTH_CMD}/update/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                loadUsers();
                loadNotifications();
            }
        }

        async function deleteUser(userId) {
            if (!confirm("Delete this user permanently?")) return;
            const res = await fetch(`${AUTH_CMD}/delete/${userId}`, { method: 'DELETE' });
            if (res.ok) {
                loadUsers();
                loadNotifications();
            }
        }

        // --- UTILS ---
        function exportData(format) {
            window.open(`${API_BASE}/queries/export/${format}`, '_blank');
        }

        function toggleAddForm() {
            const form = document.getElementById('add-form');
            if (form.style.display === 'grid') { resetForm(); }
            else {
                form.style.display = 'grid';
                document.getElementById('newTeam').disabled = false;
                document.getElementById('newPoints').disabled = false;

                if (currentUser.role === 'TEAM_MANAGER') {
                    document.getElementById('newTeam').value = currentUser.team;
                    document.getElementById('newTeam').disabled = true;
                    document.getElementById('newPoints').value = 0;
                    document.getElementById('newPoints').disabled = true;
                }
            }
        }

        function resetForm() {
            document.getElementById('editDriverId').value = "";
            document.getElementById('newName').value = "";
            document.getElementById('newTeam').value = "";
            document.getElementById('newPoints').value = "";
            document.getElementById('newNationality').value = "";
            document.getElementById('save-btn').innerText = "Save";
            document.getElementById('cancel-btn').style.display = "none";
            document.getElementById('add-form').style.display = "none";
        }

        function logout() {
            localStorage.clear();
            window.location.replace("http://localhost:8082/login.html");
        }
    </script>
</body>

</html>
