<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>F1 Authentication</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a1a; color: white; margin: 0; }
        .login-card { background: #333; padding: 40px; border-radius: 10px; width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #e10600; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>F1 AUTHENTICATION</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button type="button" onclick="login(event)">LOGIN</button>
    <div style="margin-top: 15px; font-size: 0.9em;">
        <a href="register.html" style="color: #aaa; text-decoration: none; transition: 0.3s;" onmouseover="this.style.color='#e10600'" onmouseout="this.style.color='#aaa'">Don't have an account? Register here</a>
    </div>
    <p id="msg"></p>
</div>

<script>
    async function login(event) {
        if (event) event.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const msgArea = document.getElementById('msg');

        try {
            const res = await fetch('http://localhost:8082/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            if (res.ok) {
                const userData = await res.json();
                localStorage.clear();
                localStorage.setItem('userRole', userData.role);
                localStorage.setItem('userName', userData.username);

                // Force redirect to the other microservice
                setTimeout(() => {
                    window.location.replace(`http://localhost:8081/index.html?role=${userData.role}&username=${userData.username}&team=${userData.managedTeam || ''}`);
                }, 150);
            } else {
                msgArea.innerText = "Invalid credentials!";
                msgArea.style.color = "#ff4444";
            }
        } catch (error) {
            msgArea.innerText = "IdentityService is down!";
        }
    }
</script>
</body>
</html>
